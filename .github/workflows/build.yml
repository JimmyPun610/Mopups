# Compiles the iOS (and Android) targets on a GitHub-hosted Mac.
# Library builds need no signing or provisioning.
name: build-platform

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # MAUI workloads, not the bare platform ones: restore evaluates every TFM, including the
      # plain net10.0 reference target, and UseMaui needs the MAUI packs there too.
      # maui-ios / maui-android pull in the ios / android workloads they depend on.
      - name: Install workloads
        run: dotnet workload install maui-ios maui-android

      # The iOS workload pins a minimum Xcode. If the build fails with an Xcode version error,
      # list what the runner has and select a matching one, e.g.:
      #   ls /Applications | grep Xcode
      #   sudo xcode-select -s /Applications/Xcode_26.0.app
      - name: Show toolchain
        run: |
          dotnet --info
          dotnet workload list
          xcodebuild -version

      - name: Build iOS
        run: dotnet build src/Nkraft.Mopups.csproj -c Release -f net10.0-ios

      - name: Build Android
        run: dotnet build src/Nkraft.Mopups.csproj -c Release -f net10.0-android